<app-authenticated-nav /><main class="app-page"><section class="app-panel" aria-labelledby="crear-title"><a class="back-link" routerLink="/home">Volver a inicio</a><p class="auth-eyebrow">Nuevo movimiento</p><h1 id="crear-title">Registra tu actividad</h1>@if (errorMessage(); as message) { <p class="auth-message auth-message--error" role="alert">{{ message }}</p> } @if (isLoadingCategories()) { <p class="page-state" role="status">Cargando categorías...</p> } @else if (categorias().length === 0) { <p class="page-state">No hay categorías disponibles para crear un movimiento.</p> } @else { <form class="movement-form" [formGroup]="form" (ngSubmit)="submit()" novalidate><label for="cantidad">Cantidad</label><input id="cantidad" type="number" min="0.01" step="0.01" formControlName="cantidad" /><label for="fecha">Fecha</label><input id="fecha" type="date" formControlName="fecha" /><label for="categoria">Categoría</label><select id="categoria" formControlName="categoriaId"><option [ngValue]="null">Selecciona una categoría</option>@for (categoria of categorias(); track categoria.id) { <option [ngValue]="categoria.id">{{ categoria.nombre }} ({{ categoria.tipo === 1 ? 'Ingreso' : 'Gasto' }})</option> }</select><label for="descripcion">Descripción (opcional)</label><textarea id="descripcion" rows="3" maxlength="250" formControlName="descripcion"></textarea><button type="submit" [disabled]="isSubmitting()">{{ isSubmitting() ? 'Guardando...' : 'Crear movimiento' }}</button></form> }</section></main>
